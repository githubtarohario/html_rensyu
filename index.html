<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML練習サイト</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-main">
    <h1>HTML練習サイト</h1>
    <p class="subtitle">問題を選んで、HTMLタグを書いて「実行」すると結果が確認できます</p>
  </div>

  <div class="header-login">
    <form id="login-form" class="login-form">
      <input type="text" id="nickname-input" class="nickname-input" placeholder="ニックネームを入力">
      <button type="submit" class="btn btn-primary">ログイン</button>
      <p id="login-error" class="login-error hidden"></p>
    </form>

    <div id="current-user" class="current-user hidden">
      <span class="current-user-label">ログイン中:</span>
      <span id="current-user-name" class="current-user-name"></span>
      <span class="current-score-label">得点:</span>
      <span id="current-score" class="current-score">0</span>
      <button id="logout-btn" class="btn">ログアウト</button>
    </div>
  </div>
</header>

<div class="app-layout">

  <aside class="sidebar" id="sidebar">
    <!-- 問題一覧はscript.jsが自動生成 -->
  </aside>

  <main class="main-area">

    <section class="problem-panel">
      <h2 id="problem-title">問題を選んでください</h2>
      <div id="problem-description" class="problem-description">
        左の一覧から練習したい問題をクリックしてください。
      </div>
      <div class="answer-section">
        <button id="answer-toggle-btn" class="btn">💡 解答を見る</button>
        <pre id="answer-code" class="answer-code hidden"><code id="answer-code-content"></code></pre>
      </div>
    </section>

    <section class="work-panel">
      <div class="work-column">
        <div class="work-column-header">
          <span>HTMLを入力</span>
          <div class="button-group">
            <button id="run-btn" class="btn btn-primary">▶ 実行</button>
            <button id="save-btn" class="btn">💾 保存</button>
            <button id="reset-btn" class="btn">リセット</button>
          </div>
        </div>
        <div class="editor-wrap">
          <pre id="code-highlight" class="code-highlight" aria-hidden="true"><code id="code-highlight-code"></code></pre>
          <textarea id="code-input" class="code-editor" spellcheck="false" placeholder="ここにHTMLタグを書いてください"></textarea>
        </div>
      </div>

      <div class="work-column">
        <div class="work-column-header">
          <span>実行結果（ブラウザ表示）</span>
        </div>
        <iframe id="preview" title="実行結果"></iframe>
      </div>
    </section>

  </main>

  <aside class="leaderboard-panel">
    <h2 class="leaderboard-title">ランキング</h2>
    <ul id="leaderboard-list" class="leaderboard-list">
      <!-- ランキングはscript.jsが自動生成 -->
    </ul>
  </aside>
</div>

<script src="problems.js"></script>
<script src="highlight.js"></script>
<script src="checker.js"></script>
<script src="script.js"></script>
</body>
</html>
